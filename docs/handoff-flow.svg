<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1180" viewBox="0 0 480 1180" role="img" aria-labelledby="title desc">
<title id="title">Wake Codex: from durable wait to continuation</title>
<desc id="desc">Register the chat UUID and follow-up instruction, then persist a durable wait before starting the job. End the agent turn. When a terminal event arrives, save it to the existing wait, making it ready. Queue the follow-up to the same chat. An available compatible owning session consumes the message, and the agent inspects results and follows the saved instruction within its authority. Queue acceptance does not prove that the agent ran.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b9d9a"/></marker></defs>
<rect width="480" height="1180" rx="20" fill="#f5f7f4"/>
<text x="32" y="41" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#4d6c64">WAKE CODEX / HANDOFF</text>
<text x="32" y="73" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#18342d">Wait. Then continue.</text>
<text x="32" y="101" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#566a63">One durable handoff. The same chat.</text>
<g id="step-1">
<rect x="24" y="126" width="432" height="94" rx="12" fill="#ffffff" stroke="#d7e0d9"/>
<circle cx="51" cy="154" r="13" fill="#eaf0eb"/>
<text x="51" y="159" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#18342d">1</text>
<text x="76" y="157" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#566a63">REGISTER</text>
<text x="42" y="185" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#18342d">Register the chat</text>
<text x="42" y="207" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#566a63">Save its UUID and follow-up instruction.</text>
</g>
<path d="M240 220V243" fill="none" stroke="#8b9d9a" stroke-width="2" marker-end="url(#arrow)"/>
<g id="step-2">
<rect x="24" y="248" width="432" height="94" rx="12" fill="#ffffff" stroke="#d7e0d9"/>
<circle cx="51" cy="276" r="13" fill="#eaf0eb"/>
<text x="51" y="281" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#18342d">2</text>
<text x="76" y="279" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#566a63">PERSIST</text>
<text x="42" y="307" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#18342d">Save the durable wait</text>
<text x="42" y="329" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#566a63">Record the handoff before launching work.</text>
</g>
<path d="M240 342V365" fill="none" stroke="#8b9d9a" stroke-width="2" marker-end="url(#arrow)"/>
<g id="step-3">
<rect x="24" y="370" width="432" height="94" rx="12" fill="#ffffff" stroke="#d7e0d9"/>
<circle cx="51" cy="398" r="13" fill="#eaf0eb"/>
<text x="51" y="403" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#18342d">3</text>
<text x="76" y="401" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#566a63">RUN</text>
<text x="42" y="429" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#18342d">Start the job</text>
<text x="42" y="451" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#566a63">End the agent turn; ordinary code waits.</text>
</g>
<path d="M240 464V487" fill="none" stroke="#8b9d9a" stroke-width="2" marker-end="url(#arrow)"/>
<g id="step-4">
<rect x="24" y="492" width="432" height="94" rx="12" fill="#ffffff" stroke="#d7e0d9"/>
<circle cx="51" cy="520" r="13" fill="#eaf0eb"/>
<text x="51" y="525" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#18342d">4</text>
<text x="76" y="523" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#566a63">REPORT</text>
<text x="42" y="551" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#18342d">Receive a terminal event</text>
<text x="42" y="573" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#566a63">Job finishes, fails, pauses or needs review.</text>
</g>
<path d="M240 586V609" fill="none" stroke="#8b9d9a" stroke-width="2" marker-end="url(#arrow)"/>
<g id="step-5">
<rect x="24" y="614" width="432" height="94" rx="12" fill="#ffffff" stroke="#d7e0d9"/>
<circle cx="51" cy="642" r="13" fill="#eaf0eb"/>
<text x="51" y="647" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#18342d">5</text>
<text x="76" y="645" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#566a63">PERSIST</text>
<text x="42" y="673" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#18342d">Save the event to the wait</text>
<text x="42" y="695" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#566a63">The existing wait becomes ready.</text>
</g>
<path d="M240 708V731" fill="none" stroke="#8b9d9a" stroke-width="2" marker-end="url(#arrow)"/>
<g id="step-6">
<rect x="24" y="736" width="432" height="94" rx="12" fill="#ffffff" stroke="#d7e0d9"/>
<circle cx="51" cy="764" r="13" fill="#eaf0eb"/>
<text x="51" y="769" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#18342d">6</text>
<text x="76" y="767" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#566a63">QUEUE</text>
<text x="42" y="795" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#18342d">Queue the follow-up</text>
<text x="42" y="817" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#566a63">Address the message to the same chat.</text>
</g>
<path d="M240 830V853" fill="none" stroke="#8b9d9a" stroke-width="2" marker-end="url(#arrow)"/>
<g id="step-7">
<rect x="24" y="858" width="432" height="94" rx="12" fill="#ffffff" stroke="#d7e0d9"/>
<circle cx="51" cy="886" r="13" fill="#eaf0eb"/>
<text x="51" y="891" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#18342d">7</text>
<text x="76" y="889" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#566a63">CONSUME</text>
<text x="42" y="917" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#18342d">Owning session consumes it</text>
<text x="42" y="939" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#566a63">Requires an available, compatible session.</text>
</g>
<path d="M240 952V975" fill="none" stroke="#8b9d9a" stroke-width="2" marker-end="url(#arrow)"/>
<g id="step-8">
<rect x="24" y="980" width="432" height="94" rx="12" fill="#183e34" stroke="#d7e0d9"/>
<circle cx="51" cy="1008" r="13" fill="#355d50"/>
<text x="51" y="1013" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff">8</text>
<text x="76" y="1011" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#d1e1d9">CONTINUE</text>
<text x="42" y="1039" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Agent inspects the results</text>
<text x="42" y="1061" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d1e1d9">Follow the saved instruction and authority.</text>
</g>
<text x="240" y="1144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#566a63">Queue accepted ≠ agent ran.</text>
</svg>
